# Silver Line claim ledger — the register of record for what this instrument
# claims and refuses to claim. docs/claim_boundaries.md carries the prose.
schema_version: "1.0"
line_id: silver_line
claims:
  - id: succession-reading
    statement: >
      Given a declared scan set, read_succession returns a verdict describing
      declared provision and custody consistency at an explicitly supplied
      review date, or an explicitly undated reading when no date is supplied.
    tier: executable
    evidence: tests/test_evaluator.py
  - id: fail-closed-empty
    statement: >
      An empty or wholly malformed scan set produces OUTSIDE_SCOPE or
      NEEDS_REWORK with intake notes, never a favorable default.
    tier: executable
    evidence: tests/test_intake.py, tests/test_evaluator.py
  - id: registry-digest
    statement: >
      registry_digest pins the exact keepsake content that produced a verdict;
      an unexpected change is drift, not safety information.
    tier: executable
    evidence: tests/test_serialization.py
  - id: custody-consistency
    statement: >
      Missing named custody on applicable entrustment requirements prevents
      KEPT and is linked to the source item; unrelated items cannot compensate.
    tier: executable
    evidence: tests/test_review_boundaries.py, tests/test_review_acceptance.py
  - id: reviewed-vocabulary
    statement: >
      Unknown item tags are actually excluded and unknown custom-registry
      tags fail closed under the reviewed package vocabulary.
    tier: executable
    evidence: tests/test_review_boundaries.py
  - id: lapse-is-not-silence
    statement: >
      Eligibility with missing labels is not yet declared. An explicit
      release matching both the reading subject and exact item is represented
      without a retention penalty, with restraint independent and no action
      permission implied. Subject and source references are declarations only.
    tier: executable
    evidence: tests/test_review_boundaries.py, tests/test_review_acceptance.py
  - id: replay-identity
    statement: >
      Reports bind subject, original source and normalized declaration,
      item findings, date, versions and qualified scope. Scan and registry
      permutations preserve identity under set semantics.
    tier: executable
    evidence: tests/test_review_identity.py, tests/test_review_acceptance.py
  - id: envelope-replay
    statement: >
      Both synthetic envelopes regenerate from distinct fixtures and
      content-addressed reports and snapshots; every envelope field has a
      negative control. Formalism label parity alone is not semantic proof.
    tier: executable
    evidence: tests/test_review_acceptance.py
  - id: explicit-fixture-release
    statement: >
      Only absent or null fixture releases mean no release. Malformed supplied
      releases are rejected before artifact publication; complete inconsistent
      declarations remain native item-linked gaps.
    tier: executable
    evidence: tests/test_review_acceptance.py
  - id: fixture-label-arrays
    statement: >
      Ordinary JSON fixture tags and evidence must be arrays before conversion
      to native frozen label sets. Non-array fields are refused before reading
      or artifact publication; object keys and string characters cannot supply
      declarations. Malformed scalar labels inside arrays retain native
      set-aside behavior, and matching release never replaces restraint evidence.
    tier: executable
    evidence: tests/test_review_acceptance.py
  - id: malformed-text-custody
    statement: >
      Surrogate-containing descriptions and item IDs are set aside before
      scoring; malformed labels are dropped and malformed custodians expose
      custody gaps. Malformed release fields remain item-linked NEEDS_REWORK
      findings, never absence or a successful release. Safe diagnostic IDs
      preserve whole-scan duplicate checks for valid declared identities.
    tier: executable
    evidence: tests/test_review_unicode.py
  - id: rejected-source-replay
    statement: >
      The native silver_line.text-code-units/1 codec retains original malformed
      code units in source and fixture snapshots while preserving valid scalar
      canonical bytes. The fixture consumer restores original rejected
      declarations for complete report replay, including source identity,
      counts and notes; normalized accepted rows alone are not a general
      replay source. The codec does not validate evidence or serialize
      arbitrary unsupported Python producers.
    tier: executable
    evidence: tests/test_review_unicode.py
non_claims:
  - No guarantee of persistence: a KEPT verdict describes declared custody.
  - Not an immortality project; nothing here outlives its custodians by promise.
  - Not an infallible archive; drift is expected and named, not prevented.
  - Not permission; no verdict authorizes any action or release.
