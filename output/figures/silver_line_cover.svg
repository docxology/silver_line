<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="cover-title cover-desc"><title id="cover-title">silver_line cover</title><desc id="cover-desc">Three silver strokes across a cream field: one preserved whole, one entrusting itself downward at a node, one dissolving into dashes before its end.</desc><rect width="1800" height="1100" fill="#f5e6d3"/><rect x="60" y="60" width="1680" height="980" fill="none" stroke="#b7a894" stroke-width="2.5"/><text x="120" y="168" font-family="Arial, sans-serif" font-size="44px" font-weight="700" fill="#211c1b" text-anchor="start" letter-spacing="3">SILVER LINE</text><line x1="135" y1="460" x2="1665" y2="460" stroke="#8f939b" stroke-width="30" stroke-linecap="round"/><path d="M 135 660 H 800 L 870 715 H 1665" fill="none" stroke="#8f939b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="870" cy="715" r="20" fill="#f5e6d3" stroke="#8f939b" stroke-width="12"/><line x1="135" y1="860" x2="650" y2="860" stroke="#8f939b" stroke-width="30" stroke-linecap="round"/><line x1="710" y1="860" x2="1050" y2="860" stroke="#8f939b" stroke-width="30" stroke-linecap="round" stroke-dasharray="44 36" opacity="0.7"/><line x1="1110" y1="860" x2="1280" y2="860" stroke="#8f939b" stroke-width="30" stroke-linecap="round" stroke-dasharray="20 42" opacity="0.45"/><text x="1680" y="990" font-family="Arial, sans-serif" font-size="30px" font-weight="400" fill="#5a504a" text-anchor="end" letter-spacing="3">WHAT IS PRESERVED, WHAT IS ENTRUSTED, WHAT MAY LAPSE</text></svg>