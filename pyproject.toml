[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silver_line"
version = "0.1.0"
description = "A memory-and-succession line: what is preserved, what is entrusted to whom, what is allowed to lapse"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.6.0"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
